<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amapola Pastelería — Pasteles vegetarianos para cumpleaños</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cafe-oscuro: #3b2316;
      --cafe-medio: #633d28;
      --cafe-suave: #8b5a3c;
      --crema-fondo: #f7efe6;
      --crema-tarjeta: #fffdf9;
      --arena: #efe1d1;
      --borde: #dec8b0;
      --texto: #2c1910;
      --texto-tenue: #694e3f;
      --amapola: #a8322d;
      --sombra: 0 16px 38px rgba(59, 35, 22, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 36px 18px 72px;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--texto);
      line-height: 1.65;
      background-color: var(--crema-fondo);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(139, 90, 60, 0.11), transparent 40%),
        radial-gradient(circle at 88% 18%, rgba(99, 61, 40, 0.09), transparent 42%);
    }

    .contenedor {
      max-width: 960px;
      margin: 0 auto;
    }

    .panel {
      background: var(--crema-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 24px;
      box-shadow: var(--sombra);
      overflow: hidden;
    }

    .cabecera {
      padding: 40px 36px 34px;
      text-align: center;
      background: linear-gradient(180deg, #fffaf4 0%, #f3e5d5 100%);
      border-bottom: 1px solid var(--borde);
    }

    .logo-ap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      color: var(--cafe-oscuro);
    }

    .marca-curva {
      margin: 0;
      font-family: "Alex Brush", "Cormorant Garamond", cursive;
      font-size: clamp(2.8rem, 6vw, 4rem);
      font-weight: 400;
      line-height: 1.05;
      color: var(--cafe-oscuro);
    }

    .subtitulo-marca {
      margin: 4px 0 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.25rem;
      font-style: italic;
      color: var(--cafe-medio);
    }

    .descripcion {
      margin: 14px auto 24px;
      max-width: 68ch;
      color: var(--texto-tenue);
      font-size: 1rem;
    }

    .btn-asistente {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cafe-oscuro);
      color: #fffdf9;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-asistente:hover {
      background: var(--cafe-medio);
      transform: translateY(-1px);
    }

    .cuerpo {
      padding: 36px;
    }

    h2 {
      margin: 0 0 14px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.85rem, 3.5vw, 2.3rem);
      font-weight: 700;
      color: var(--cafe-oscuro);
    }

    .texto-seccion {
      margin: 0 0 18px;
      color: var(--texto-tenue);
    }

    .banner-publico {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--borde);
      background: var(--arena);
      box-shadow: 0 8px 22px rgba(59, 35, 22, 0.06);
    }

    .banner-publico img {
      display: block;
      width: 100%;
      height: 290px;
      object-fit: cover;
    }

    .pie-publico {
      padding: 14px 18px;
      background: #faf1e6;
      font-size: 0.94rem;
      color: var(--cafe-oscuro);
    }

    .divisor {
      border: 0;
      border-top: 1px solid var(--borde);
      margin: 34px 0;
    }

    .grid-sabores {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .tarjeta-sabor {
      background: #fffdfb;
      border: 1px solid var(--borde);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tarjeta-sabor:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(59, 35, 22, 0.09);
    }

    .tarjeta-sabor img {
      display: block;
      width: 100%;
      height: 205px;
      object-fit: cover;
      background: var(--arena);
    }

    .tarjeta-sabor-info {
      padding: 16px;
    }

    .tarjeta-sabor h3 {
      margin: 0 0 6px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 1.38rem;
      color: var(--cafe-oscuro);
    }

    .tarjeta-sabor p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--texto-tenue);
    }

    .tabla-precios {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }

    .tabla-precios th {
      text-align: left;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--texto-tenue);
      padding: 6px 16px;
    }

    .fila-precio {
      background: #fffdfb;
      transition: background-color 0.2s ease;
    }

    .fila-precio td {
      padding: 13px 16px;
      border-top: 1px solid var(--borde);
      border-bottom: 1px solid var(--borde);
    }

    .fila-precio td:first-child {
      border-left: 1px solid var(--borde);
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
      font-weight: 600;
      color: var(--cafe-oscuro);
    }
